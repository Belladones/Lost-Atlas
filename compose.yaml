services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas-local-development}
      POSTGRES_DB: lost_atlas
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d lost_atlas"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
